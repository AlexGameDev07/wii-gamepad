<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1000" viewBox="0 0 1260 1000">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#dfe3ea"/>
    </linearGradient>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2e2e32"/>
      <stop offset="1" stop-color="#17171a"/>
    </linearGradient>
    <radialGradient id="brillo">
      <stop offset="0" stop-color="#e62d42" stop-opacity="0.75"/>
      <stop offset="0.55" stop-color="#e62d42" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#e62d42" stop-opacity="0"/>
    </radialGradient>
    <filter id="sombra" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="30" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="1260" height="1000" fill="url(#fondo)"/>
  <circle cx="950" cy="305" r="560" fill="url(#brillo)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4">
    <circle cx="950" cy="305" r="300"/>
    <circle cx="950" cy="305" r="420"/>
    <circle cx="950" cy="305" r="540"/>
  </g>
  <g filter="url(#sombra)" transform="translate(950 305) rotate(24) scale(5.9) translate(-64 -64)">
    <g transform="translate(0 0)">
    <rect x="45" y="14" width="38" height="100" rx="13" fill="#0b2a4a" opacity="0.25" transform="translate(3 4)"/>
    <rect x="45" y="14" width="38" height="100" rx="13" fill="url(#body)"/>
    <!-- botón de encendido -->
    <circle cx="58" cy="23" r="3" fill="#c9ced8"/>
    <circle cx="58" cy="23" r="1.6" fill="#e5484d"/>
    <!-- cruceta -->
    <rect x="59.5" y="31" width="9" height="25" rx="1.5" fill="#3a3d4a"/>
    <rect x="51.5" y="39" width="25" height="9" rx="1.5" fill="#3a3d4a"/>
    <!-- A -->
    <circle cx="64" cy="66" r="6.5" fill="#c9ced8"/>
    <circle cx="64" cy="66" r="5" fill="#f4f6f9"/>
    <!-- − Home + -->
    <circle cx="55" cy="81" r="2.6" fill="#c9ced8"/>
    <circle cx="64" cy="81" r="2.6" fill="#3fa7ff"/>
    <circle cx="73" cy="81" r="2.6" fill="#c9ced8"/>
    <!-- 1 y 2 -->
    <circle cx="64" cy="92" r="3.6" fill="#c9ced8"/>
    <circle cx="64" cy="101" r="3.6" fill="#c9ced8"/>
    <!-- luces -->
    <rect x="54" y="108" width="3" height="2" rx="1" fill="#3fa7ff"/>
    <rect x="59.5" y="108" width="3" height="2" rx="1" fill="#c9ced8"/>
    <rect x="65" y="108" width="3" height="2" rx="1" fill="#c9ced8"/>
    <rect x="70.5" y="108" width="3" height="2" rx="1" fill="#c9ced8"/>
  </g>
  </g>
  <g font-family="Adwaita Sans, sans-serif" fill="#ffffff">
    <text x="84" y="770" font-size="120" font-weight="800" letter-spacing="-3">Wii Gamepad</text>
    <text x="88" y="848" font-size="46" font-weight="500" fill="#d8d8dc">Your Wii Remote as an Xbox controller</text>
    <rect x="88" y="886" width="136" height="54" rx="27" fill="#e62d42"/>
    <text x="156" y="924" font-size="30" font-weight="700" text-anchor="middle">Linux</text>
  </g>
</svg>
